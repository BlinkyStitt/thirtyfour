on:
  push:
    branches: [main]
  pull_request:
name: cargo hack
concurrency:
  group: pr-ci-features.yml-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
      - uses: actions/checkout@v2
        with:
          submodules: true
      - name: Install cargo-hack
        uses: actions-rs/install@v0.1
        with:
          crate: cargo-hack
          version: latest
          use-tool-cache: true
      - name: cargo hack
        uses: actions-rs/cargo@v1
        with:
          command: hack
          args: --feature-powerset --exclude-features bench_private check
